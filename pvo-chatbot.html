<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PVO Assistant – Poway Veterans Organization</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0d1f3c;--red:#b22234;--gold:#c9a84c;--cream:#f7f3ec;--light-gray:#e8e4dd;--mid:#8a8070;--white:#fff;--radius:12px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Source Sans 3',sans-serif;background:var(--navy);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;background-image:radial-gradient(ellipse at 20% 80%,rgba(185,34,52,.15) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(201,168,76,.1) 0%,transparent 50%)}
  .header{width:100%;max-width:700px;display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .header-icon{width:52px;height:52px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;box-shadow:0 4px 16px rgba(178,34,52,.5)}
  .header-text h1{font-family:'Playfair Display',serif;font-size:1.35rem;color:var(--cream);line-height:1.15}
  .header-text p{font-size:.8rem;color:var(--gold);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
  .chat-window{width:100%;max-width:700px;background:var(--cream);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;height:560px;box-shadow:0 24px 64px rgba(0,0,0,.45);border:1px solid rgba(201,168,76,.25)}
  .messages{flex:1;overflow-y:auto;padding:22px 20px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
  .messages::-webkit-scrollbar{width:5px}.messages::-webkit-scrollbar-thumb{background:var(--light-gray);border-radius:99px}
  .msg{display:flex;gap:10px;animation:fadeUp .3s ease;max-width:90%}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}.msg.bot{align-self:flex-start}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;margin-top:2px}
  .bot .avatar{background:var(--navy)}.user .avatar{background:var(--red)}
  .bubble{padding:12px 16px;border-radius:var(--radius);font-size:.92rem;line-height:1.55;max-width:100%}
  .bot .bubble{background:var(--white);color:var(--navy);border-bottom-left-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
  .user .bubble{background:var(--navy);color:var(--cream);border-bottom-right-radius:4px}
  .bubble a{color:var(--red);font-weight:600;text-decoration:none;border-bottom:1px solid rgba(178,34,52,.3)}
  .bubble a:hover{border-color:var(--red)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{background:var(--cream);border:1.5px solid var(--gold);color:var(--navy);font-family:'Source Sans 3',sans-serif;font-size:.8rem;font-weight:600;padding:6px 13px;border-radius:99px;cursor:pointer;transition:background .18s,color .18s}
  .chip:hover{background:var(--gold);color:var(--white)}
  .typing-dots{display:flex;align-items:center;gap:5px;padding:4px 2px}
  .typing-dots span{width:7px;height:7px;border-radius:50%;background:var(--mid);animation:bounce 1.1s infinite}
  .typing-dots span:nth-child(2){animation-delay:.18s}.typing-dots span:nth-child(3){animation-delay:.36s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
  .input-bar{display:flex;gap:10px;padding:14px 16px;background:var(--white);border-top:1px solid var(--light-gray)}
  .input-bar input{flex:1;border:1.5px solid var(--light-gray);border-radius:99px;padding:10px 18px;font-family:'Source Sans 3',sans-serif;font-size:.9rem;color:var(--navy);background:var(--cream);outline:none;transition:border-color .2s}
  .input-bar input:focus{border-color:var(--navy)}.input-bar input::placeholder{color:var(--mid)}
  .send-btn{width:42px;height:42px;border-radius:50%;background:var(--navy);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .18s,transform .15s;flex-shrink:0}
  .send-btn:hover{background:var(--red);transform:scale(1.07)}.send-btn:disabled{background:var(--light-gray);cursor:default;transform:none}
  .send-btn svg{width:18px;height:18px;fill:none;stroke:white;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .footer{margin-top:12px;font-size:.72rem;color:rgba(247,243,236,.45);text-align:center}
  .footer a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🎖️</div>
  <div class="header-text">
    <h1>Poway Veterans Organization</h1>
    <p>Virtual Assistant · PVO Guide</p>
  </div>
</div>

<div class="chat-window">
  <div class="messages" id="messages"></div>
  <div class="input-bar">
    <input type="text" id="userInput" placeholder="Ask me anything about PVO…" autocomplete="off"/>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<div class="footer">
  Powered by <a href="https://powayveterans.org" target="_blank">powayveterans.org</a> &nbsp;·&nbsp; PVO is a 501(c)3 non-profit · (858) 206-8854
</div>

<script type="module">
  import pythonURI from '/assets/js/api/config.js';
const SYS = `You are a warm, respectful virtual assistant for the Poway Veterans Organization (PVO), a 501c3 non-profit in Poway, CA. Help veterans and families, answer questions about PVO services, and guide users to the right website pages.
ABOUT PVO: Assists veterans and dependents in Poway, Ramona, and surrounding areas with financial need due to illness, injury, unemployment or hardship. Founded 2014. 95%+ of funds go to veteran assistance. All volunteers. Phone: (858) 206-8854. Email: contact@powayveterans.org. Address: PO Box 563, Poway CA 92064.
SERVICES: Home repairs, Medical, Counseling, Legal, Transportation (vehicle registration aid and transit vouchers), Family support, Meals and food, VA Services navigation, Other hardship needs.
KEY PAGES:
- Home: https://powayveterans.org/
- About: https://powayveterans.org/about-pvo/
- Apply For Assistance: https://powayveterans.org/request-assistance/
- Donate: https://powayveterans.org/donate/
- Volunteer: https://powayveterans.org/volunteer/
- Scholarships: https://powayveterans.org/scholarships/
- Events: https://powayveterans.org/calendar/
- Golf Tournament: https://powayveterans.org/annual-golf-tournament/
- Newsletter: https://powayveterans.org/newsletter/
- Blog: https://powayveterans.org/blog-2/
RULES: Be warm and respectful. Direct veterans needing help to https://powayveterans.org/request-assistance/ . Use Markdown links [text](url). If unsure, say to call (858) 206-8854. Do not invent information.`;

let history = [], loading = false;

function addMessage(role, html, chips = []) {
  const wrap = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = role === 'bot' ? '🎖️' : '👤';
  const right = document.createElement('div');
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = html;
  right.appendChild(b);
  if (chips.length) {
    const row = document.createElement('div');
    row.className = 'chips';
    chips.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.textContent = c;
      btn.onclick = () => sendMessage(c);
      row.appendChild(btn);
    });
    right.appendChild(row);
  }
  d.appendChild(av);
  d.appendChild(right);
  wrap.appendChild(d);
  wrap.scrollTop = wrap.scrollHeight;
}

function toHtml(t) {
  t = t.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  t = t.replace(/^[-•] (.+)$/gm, '<li>$1</li>');
  t = t.replace(/(<li>[\s\S]*<\/li>)/, '<ul style="padding-left:18px;margin-top:6px;display:flex;flex-direction:column;gap:4px">$1</ul>');
  return t.replace(/\n\n/g, '<br><br>').replace(/\n/g, '<br>');
}

async function sendMessage(override) {
  if (loading) return;
  const inp = document.getElementById('userInput');
  const text = (override || inp.value).trim();
  if (!text) return;
  inp.value = '';
  addMessage('user', text);
  history.push({ role: 'user', content: text });
  loading = true;
  document.getElementById('sendBtn').disabled = true;
  const wrap = document.getElementById('messages');
  const td = document.createElement('div');
  td.className = 'msg bot';
  td.id = 'typing';
  td.innerHTML = '<div class="avatar">🎖️</div><div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
  wrap.appendChild(td);
  wrap.scrollTop = wrap.scrollHeight;
  try {
    const r = await fetch(pythonURI + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: history
      })
    });
    const data = await r.json();
    document.getElementById('typing')?.remove();
    const reply = data.content?.[0]?.text || "Sorry, I could not get a response. Please call (858) 206-8854.";
    history.push({ role: 'assistant', content: reply });
    addMessage('bot', toHtml(reply));
  } catch (e) {
    document.getElementById('typing')?.remove();
    addMessage('bot', 'Sorry, something went wrong. Please <a href="mailto:contact@powayveterans.org">email us</a> or call (858) 206-8854.');
  }
  loading = false;
  document.getElementById('sendBtn').disabled = false;
  inp.focus();
}

document.getElementById('userInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMessage();
});

window.onload = () => addMessage('bot',
  'Welcome, and thank you for your service! &#127482;&#127480;<br><br>I\'m the <strong>PVO Virtual Assistant</strong>. I\'m here to help you navigate the <a href="https://powayveterans.org" target="_blank">Poway Veterans Organization</a> website.<br><br>How can I assist you today?',
  ['Apply for Assistance', 'Scholarships', 'Volunteer / Donate', 'Upcoming Events', 'Contact PVO']
);
</script>
</body>
</html>
